<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Staffroom</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #16171b;
        --ink: #e8eaed;
        --muted: #9aa0aa;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        -webkit-app-region: drag;
        -webkit-user-select: none;
        user-select: none;
      }
      h1 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <h1>Staffroom</h1>
    <p>Starting your local server…</p>
  </body>
</html>
