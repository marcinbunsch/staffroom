<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <title>Staffroom</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        font:
          15px/1.5 -apple-system,
          system-ui,
          sans-serif;
        background: Canvas;
        color: CanvasText;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 320px;
      }
      h1 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <!--
      This bundled page is only shown when the remote Staffroom server is
      unreachable at launch (Capacitor's server.url fallback). The live app is
      always served by the server itself.
    -->
    <div class="card">
      <h1>Can't reach Staffroom</h1>
      <p>The server didn't respond. Check your connection and reopen the app.</p>
    </div>
  </body>
</html>
